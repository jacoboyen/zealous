<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zealous Racing · Race manager</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{color-scheme:light;--bg:#fff;--card:#fff;--tx:#10193a;--mu:#5d6679;--bd:#e0e3ea;--ac:#e0202a;--navy:#0f1f5c;--teal:#0b6a9e;--er:#a32d2d;--erb:#fcebeb;--ok:#2f6b1c;--okb:#e8f3de;--wa:#7a4a08;--wab:#fff1c9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:980px;margin:0 auto;padding:0 20px}
header{background:var(--navy);color:#fff;border-top:5px solid var(--teal);border-bottom:5px solid var(--ac);padding:26px 0 20px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.logo{font:300 32px/1 "Barlow","Arial Narrow",sans-serif;letter-spacing:1px}.logo b{font-weight:700}
.bar{height:20px;width:280px;max-width:100%;background:var(--ac);margin-top:10px}
.co{font:700 12px "Barlow",sans-serif;letter-spacing:2.5px}
nav{display:flex;gap:2px;flex-wrap:wrap;background:var(--teal);padding:4px}
.t{background:none;border:0;color:#fff;padding:5px 12px;font:inherit;font-weight:500;border-radius:4px;cursor:pointer}
.t.on{background:rgba(255,255,255,.2);font-weight:700}
main{max-width:980px;margin:0 auto;padding:26px 20px 60px}
.eyebrow{font:600 11px "Barlow",sans-serif;letter-spacing:2px;color:var(--teal);text-transform:uppercase}
h2.pt{margin:0 0 14px;font:300 30px/1.1 "Barlow","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.5px}h2.pt b{font-weight:800}
h3{margin:0 0 4px;font:700 17px/1.2 "Barlow","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(15,31,92,.1)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
button,select,input{font:inherit;color:var(--tx);background:#fff;border:1px solid var(--bd);border-radius:6px;padding:6px 10px;min-height:32px}
button{cursor:pointer;font-weight:600;color:var(--teal)}button:hover{border-color:var(--navy)}
button:focus-visible,select:focus-visible,input:focus-visible,.t:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.p:hover{background:#c41a24}
input.n{width:80px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:600;color:var(--mu);font-size:12px;padding:4px 8px}td{padding:6px 8px;border-top:1px solid var(--bd)}
td input{min-height:28px;padding:3px 8px}
.bib{display:inline-block;min-width:46px;text-align:center;font:800 15px "Barlow","Arial Narrow",sans-serif;border:2px solid var(--navy);border-radius:3px;padding:0 8px;background:#fff;color:var(--navy)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px;align-items:start}
.msg{padding:8px 12px;border-radius:6px;margin-bottom:14px;border:1px solid}.msg.er{background:var(--erb);color:var(--er);border-color:var(--er)}.msg.ok{background:var(--okb);color:var(--ok);border-color:var(--ok)}
.pill{display:flex;justify-content:space-between;background:var(--wab);color:var(--wa);border-radius:6px;padding:5px 9px;margin-top:6px}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:1px 8px;border-radius:10px;background:#eef0f5;color:var(--navy)}.tag.d{background:var(--ac);color:#fff}
.mu{color:var(--mu)}.gh td{background:#f1f3f8;font-weight:700;font-size:12px;color:var(--navy)}
.ends{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;max-width:300px;margin-top:6px}.ends i{font:11px system-ui;text-align:center;padding:3px 0;border:1px solid var(--bd);border-radius:3px;font-style:normal;color:var(--mu)}.ends i.u{background:var(--navy);color:#fff;border-color:var(--navy)}
.x{border:0;background:none;color:var(--mu);min-height:0;padding:0 6px}
footer{background:var(--navy);color:#fff;border-top:5px solid var(--ac);text-align:center;padding:14px 20px;font-size:13px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
@media print{header,footer,.noprint,#m,.kio{display:none!important}body{background:#fff;color:#000}.card{border:0;box-shadow:none;padding:0;break-inside:avoid}.bib{border-color:#000;color:#000}}
.kio{position:fixed;inset:0;z-index:99;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:2.5vh 3vw;overflow:hidden}.kio[hidden]{display:none}
.kh{display:flex;justify-content:space-between;align-items:baseline;gap:2vw;border-bottom:.8vh solid var(--ac);padding-bottom:1.5vh}.kh h1{margin:0;font:300 5vh/1.1 "Barlow","Arial Narrow",sans-serif;text-transform:uppercase}.kh h1 b{font-weight:800}
.kb{flex:1;display:grid;grid-template-columns:3fr 2fr;gap:3vw;min-height:0;margin-top:2.5vh}.kl{overflow:hidden}
.kr{display:flex;align-items:baseline;gap:.6em;padding:.25em 0;border-bottom:1px solid rgba(255,255,255,.18)}.kr b{width:2em;font-weight:800}.kr span{flex:1;font-weight:600}.kr em{font-style:normal;opacity:.7;font-size:.75em}
.pod{display:flex;align-items:flex-end;gap:1.2vw}.pc{flex:1;border-radius:1vh 1vh 0 0;padding:2vh .8vw;text-align:center;color:#111;display:flex;flex-direction:column;gap:.6vh;overflow:hidden}.pc b{font:800 10vh/1 "Barlow",sans-serif}.pc span{font:700 3.4vh/1.15 "Barlow",sans-serif}.pc small{font-size:2.4vh}
.kx{position:absolute;right:2vw;bottom:1vh;background:none;border:0;color:#fff;opacity:.5;font-size:14px}
.mdl{position:fixed;inset:0;z-index:50;background:rgba(15,31,92,.6);display:flex;align-items:center;justify-content:center}.mdl>div{background:#fff;border-radius:8px;padding:18px;max-width:440px;width:92%}
.lk{background:none;border:0;padding:0;min-height:0;color:var(--teal);font-weight:600;text-align:left}.lk:hover{text-decoration:underline}.fl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu);margin-top:10px}.fl input,.fl select{font-size:14px;color:var(--tx)}.mdl>div{max-height:92vh;overflow:auto}
.chip{border-radius:16px;padding:3px 12px;font-weight:600;color:var(--navy)}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}.ro{font-size:14px;color:var(--tx);padding:5px 0;border-bottom:1px solid var(--bd)}
.tm{font-size:13px;min-height:28px;padding:2px 6px;font-weight:400}
</style></head><body>
<header class="noprint"><div class="w"><div class="top"><div><div class="logo"><b>ZEALOUS</b>RACING</div><div class="bar"></div></div><div class="co">ZEALOUS × IOWA BIKE CO</div></div><nav id="nav"></nav></div></header>
<main><div id="fb" class="noprint"></div><div id="m"></div><div id="v"></div></main>
<div id="k" class="kio" hidden></div>
<footer class="noprint">Zealous Racing × Iowa Bike Co, Pella IA · Race manager UI prototype. Data lives in memory only.</footer>
<script src="app.js"></script></body></html>
