function draw(){const m=S.msg;S.msg=null;if(S.tab=='Schedule')ensureSlots();$('#nav').innerHTML=TABS.map(t=>`<button class="t ${t==S.tab?'on':''}" onclick="go('${t}')">${t}</button>`).join('');
$('#m').innerHTML=m?`<div class="msg ${m.t}" role="status">${esc(m.m)}</div>`:'';$('#fb').innerHTML=fb();const T=TT[S.tab];$('#v').innerHTML=`<div class="eyebrow noprint">Race manager${S.type?' · '+S.type:''}</div><h2 class="pt"><b>${T[0]}</b> ${T[1]}</h2>`+V[S.tab]();if(S.tab=='Riders'&&$('#dc'))sg();if(S.edit&&$('#e_cat'))$('#e_cat').focus();if(S.te&&$('#t_time'))$('#t_time').focus();if(S.tab=='Results'){const b=S.pick?$('.mdl button'):$('#kin');if(b)b.focus()}}
document.addEventListener('keydown',e=>{if(e.key=='Escape'){if(S.pick){S.pick=null;draw()}else if(S.te){S.te=null;draw()}else if(S.edit){S.edit=null;draw()}else if(!$('#k').hidden)kexit()}else if(S.pick&&/^[1-9]$/.test(e.key)){const id=S.pick.ids[+e.key-1];if(id)fin(id,S.pick.st)}});document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&!$('#k').hidden)kexit()});
draw();
</script></body></html>
